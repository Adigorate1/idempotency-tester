<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 12px/1.4 system-ui, sans-serif; width: 420px; margin: 0; padding: 10px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .bar { display: flex; gap: 6px; margin-bottom: 8px; }
  button { cursor: pointer; border: 1px solid #ccc; background: #f6f6f6; border-radius: 4px; padding: 4px 8px; }
  button:hover { background: #eee; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #e5e5e5; text-align: left; padding: 4px 6px; vertical-align: top; }
  th { font-size: 11px; color: #555; }
  td.url { word-break: break-all; max-width: 180px; font-size: 11px; }
  .empty { color: #777; padding: 12px 4px; }
</style>
</head>
<body>
  <h1>Transaction Traffic Robot</h1>
  <div class="bar">
    <button id="copy-all">Copy all JSON</button>
    <button id="clear">Clear</button>
    <span id="count" style="margin-left:auto;color:#777"></span>
  </div>
  <table>
    <thead><tr><th>Time (UTC)</th><th>Method</th><th>Status</th><th>URL</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty">No traffic captured yet — make your payment, then reopen this popup.</div>
  <script src="popup.js"></script>
</body>
</html>
